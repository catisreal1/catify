<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catify 🎵</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background-color: #000000; color: #ffffff; padding-bottom: 110px; }
        header { text-align: center; padding: 1.2rem; background: #000000; border-bottom: 1px solid #111; }
        header h1 { font-size: 1.4rem; color: #1db954; }
        .tabs { display: flex; justify-content: center; gap: 0.8rem; margin: 1rem 0; }
        .tab-btn { background: #121212; color: #888; border: 1px solid #222; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: #fff; color: #000; border-color: #fff; }
        .container { max-width: 750px; margin: 0 auto; padding: 0 1rem; }
        .playlist { display: flex; flex-direction: column; gap: 0.5rem; }
        .track-item { display: flex; justify-content: space-between; align-items: center; background: #0a0a0a; padding: 0.7rem 1rem; border-radius: 6px; border: 1px solid #1a1a1a; cursor: pointer; }
        .track-item:hover { background: #181818; }
        .track-item.playing { border-color: #1db954; background: #121212; }
        .track-info h3 { font-size: 0.9rem; color: #fff; margin-bottom: 0.1rem; }
        .track-info p { font-size: 0.75rem; color: #888; }
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #080808; border-top: 1px solid #1a1a1a; padding: 0.7rem 1rem; display: flex; flex-direction: column; gap: 0.4rem; }
        .player-info { text-align: center; font-size: 0.8rem; color: #1db954; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-controls { display: flex; justify-content: center; align-items: center; gap: 0.6rem; }
        .control-btn { background: #1a1a1a; color: #fff; border: none; padding: 0.35rem 0.8rem; border-radius: 15px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .control-btn:hover { background: #282828; }
        .control-btn.active-mode { background: #1db954; color: #000; }
        input[type="range"] { width: 100%; accent-color: #1db954; cursor: pointer; }
    </style>
</head>
<body>

    <header><h1>Catify 🐱🎵</h1></header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('music', event)">Gaming (Phonk)</button>
        <button class="tab-btn" onclick="switchTab('chill', event)">Chill / V-Pop</button>
    </div>

    <div class="container">
        <div id="playlist-container" class="playlist"></div>
    </div>

    <div class="player-bar">
        <div class="player-info" id="current-track-title">Chưa chọn bài hát nào</div>
        <input type="range" id="progress-bar" value="0" max="100" step="1">
        <div class="player-controls">
            <button class="control-btn" id="shuffle-btn" onclick="toggleShuffle()">🔀 Random</button>
            <button class="control-btn" onclick="prevTrack()">⏮ Trước</button>
            <button class="control-btn" id="play-pause-btn" onclick="togglePlay()">▶ Phát</button>
            <button class="control-btn" onclick="nextTrack()">Sau ⏭</button>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        // Danh sách rút gọn tối ưu, chỉ giữ lại đường dẫn và thông tin cốt lõi
        const tracks = [
            { title: "Can You Feel My Heart", artist: "Gaming Mix", category: "music", src: "music/Can You Feel My Heart.mp3" },
            { title: "Centuries", artist: "Fall Out Boy", category: "music", src: "music/Centuries.mp3" },
            { title: "Chris Grey - LET THE WORLD BURN", artist: "Chris Grey", category: "music", src: "music/Chris Grey - LET THE WORLD BURN.mp3" },
            { title: "CRUSHTEKK (Super Slowed)", artist: "Super Slowed", category: "music", src: "music/CRUSHTEKK (Super Slowed).mp3" },
            { title: "Dakooka", artist: "Gaming Mix", category: "music", src: "music/dakooka.mp3" },
            { title: "Đầu Đường Xó Chợ", artist: "Obito x Shiki", category: "music", src: "music/Đầu Đường Xó Chợ.mp3" },
            { title: "DIA DE FIESTA", artist: "Slowed", category: "music", src: "music/DIA DE FIESTA SLOWED.mp3" },
            { title: "Ed Sheeran - Shape of You", artist: "Ed Sheeran", category: "music", src: "music/Ed Sheeran - Shape of You.mp3" },
            { title: "gluttony", artist: "Slowed", category: "music", src: "music/gluttony (slowed).mp3" },
            { title: "HEAVENLY JUMPSTYLE", artist: "Gaming Mix", category: "music", src: "music/HEAVENLY JUMPSTYLE.mp3" },
            { title: "Immortals", artist: "Fall Out Boy", category: "music", src: "music/Immortals.mp3" },
            { title: "INVOCADO (ULTRA SLOWED)", artist: "Ultra Slowed", category: "music", src: "music/INVOCADO (ULTRA SLOWED).mp3" },
            { title: "KINDA HOMELESS FUNK", artist: "Gaming Mix", category: "music", src: "music/KINDA_HOMELESS_FUNK.mp3" },
            { title: "MONTAGEM BAILAO", artist: "Phonk Mix", category: "music", src: "music/MONTAGEM BAILAO.mp3" },
            { title: "MONTAGEM SANTA FE 2", artist: "Phonk Mix", category: "music", src: "music/MONTAGEM SANTA FE 2.mp3" },
            { title: "MONTAGEM XIN DONG", artist: "Phonk Mix", category: "music", src: "music/MONTAGEM XIN DONG.mp3" },
            { title: "MONTAGEM YUESHI", artist: "WUYS", category: "music", src: "music/MONTAGEM YUESHI - WUYS.mp3" },
            { title: "O my god", artist: "Slowed", category: "music", src: "music/O my god (Slowed).mp3" },
            { title: "SEM PERDO", artist: "Ultra Slowed", category: "music", src: "music/SEM PERDO (ultra slowed).mp3" },
            { title: "Shluzov", artist: "Slowed", category: "music", src: "music/Shluzov- Slowed.mp3" },
            { title: "Skillet - Monster", artist: "Skillet", category: "music", src: "music/Skillet - Monster (Official Video).mp3" },
            { title: "WA WA WA FUNK", artist: "Slowed", category: "music", src: "music/WA WA WA FUNK (SLOWED).mp3" },
            { title: "ZXVREN - MONTAGEM DELÍRIO", artist: "ZXVREN", category: "music", src: "music/ZXVREN - MONTAGEM DELÍRIO (Slowed).mp3" },

            { title: "An Thần", artist: "ft. Thắng", category: "chill", src: "chill/An Thần (ft. Thắng).mp3" },
            { title: "Bài Này Chill Phết", artist: "V-Pop Chill", category: "chill", src: "chill/Bài Này Chill Phết.mp3" },
            { title: "CheckMate", artist: "Chill Track", category: "chill", src: "chill/CheckMate.mp3" },
            { title: "Đen - một triệu like", artist: "Đen Vâu", category: "chill", src: "chill/Đen - một triệu like.mp3" },
            { title: "Đen x JustaTee - Đi Về Nhà", artist: "Đen x JustaTee", category: "chill", src: "chill/Đen x JustaTee - Đi Về Nhà.mp3" },
            { title: "LỚN RỒI CÒN KHÓC NHÈ", artist: "V-Pop", category: "chill", src: "chill/LỚN RỒI CÒN KHÓC NHÈ.mp3" },
            { title: "Mất Tích", artist: "Chill Track", category: "chill", src: "chill/Mất Tích.mp3" },
            { title: "Ngọt - CHUYỂN KÊNH", artist: "Ngọt", category: "chill", src: "chill/Ngọt - CHUYỂN KÊNH.mp3" },
            { title: "Thức Giấc", artist: "Da LAB", category: "chill", src: "chill/Thức Giấc - Da LAB.mp3" },
            { title: "Avicii - Waiting For Love", artist: "Avicii", category: "chill", src: "chill/Avicii - Waiting For Love.mp3" },
            { title: "David Kushner - Daylight", artist: "David Kushner", category: "chill", src: "chill/David Kushner - Daylight (Official Music Video....mp3" },
            { title: "Lukas Graham - 7 Years", artist: "Lukas Graham", category: "chill", src: "chill/Lukas Graham - 7 Years.mp3" },
            { title: "Nói Dối", artist: "Ronboogz", category: "chill", src: "chill/Nói Dối Ronboogz (Lyrics Video).mp3" },
            { title: "Olly Murs - That Girl", artist: "Olly Murs", category: "chill", src: "chill/Olly Murs - That Girl (Lyric Video).mp3" },
            { title: "Táo - Blue Tequila", artist: "Táo", category: "chill", src: "chill/Táo - Blue Tequila (Official Video).mp3" },
            { title: "Trước Khi Em Tồn Tại", artist: "V-Pop Chill", category: "chill", src: "chill/Trước Khi Em Tồn Tại.mp3" },
            { title: "BẠC PHẬN", artist: "V-Pop", category: "chill", src: "chill/BẠC PHẬN.mp3" },
            { title: "Charlie Puth - We Don't Talk Anymore", artist: "Charlie Puth", category: "chill", src: "chill/Charlie Puth - We Don't Talk Anymore.mp3" },
            { title: "Đen - Mang Tiền Về Cho Mẹ", artist: "Đen Vâu", category: "chill", src: "chill/Đen - Mang Tiền Về Cho Mẹ.mp3" },
            { title: "OneRepublic - Counting Stars", artist: "OneRepublic", category: "chill", src: "chill/OneRepublic - Counting Stars.mp3" },
            { title: "Tết Đông Đầy", artist: "V-Pop", category: "chill", src: "chill/Tết Đông Đầy.mp3" }
        ];

        let currentCategory = 'music', currentTrackIndex = 0, isShuffle = false;
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-pause-btn');
        const titleDisplay = document.getElementById('current-track-title');
        const progress = document.getElementById('progress-bar');
        const shuffleBtn = document.getElementById('shuffle-btn');

        function renderPlaylist() {
            const container = document.getElementById('playlist-container');
            container.innerHTML = '';
            tracks.forEach((t, i) => {
                if (t.category !== currentCategory) return;
                const item = document.createElement('div');
                item.className = `track-item ${i === currentTrackIndex ? 'playing' : ''}`;
                item.innerHTML = `<div class="track-info"><h3>${t.title}</h3><p>${t.artist}</p></div>`;
                item.onclick = () => playTrack(i);
                container.appendChild(item);
            });
        }

        function switchTab(cat, e) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            renderPlaylist();
        }

        function playTrack(i) {
            currentTrackIndex = i;
            audio.src = tracks[i].src;
            audio.play().catch(() => {});
            playBtn.textContent = '⏸ Tạm dừng';
            titleDisplay.textContent = `Đang phát: ${tracks[i].title} - ${tracks[i].artist}`;
            renderPlaylist();
        }

        function togglePlay() {
            if (!audio.src) {
                const first = tracks.findIndex(t => t.category === currentCategory);
                if (first !== -1) playTrack(first);
                return;
            }
            if (audio.paused) { audio.play(); playBtn.textContent = '⏸ Tạm dừng'; }
            else { audio.pause(); playBtn.textContent = '▶ Phát'; }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active-mode', isShuffle);
            shuffleBtn.textContent = isShuffle ? '🔀 Đang Random' : '🔀 Random';
        }

        function nextTrack() {
            const list = tracks.map((t, idx) => ({t, idx})).filter(x => x.t.category === currentCategory);
            if (!list.length) return;
            let nextIdx;
            if (isShuffle) {
                nextIdx = list[Math.floor(Math.random() * list.length)].idx;
            } else {
                const cur = list.findIndex(x => x.idx === currentTrackIndex);
                nextIdx = list[(cur + 1) % list.length].idx;
            }
            playTrack(nextIdx);
        }

        function prevTrack() {
            const list = tracks.map((t, idx) => ({t, idx})).filter(x => x.t.category === currentCategory);
            if (!list.length) return;
            const cur = list.findIndex(x => x.idx === currentTrackIndex);
            playTrack(list[(cur - 1 + list.length) % list.length].idx);
        }

        audio.ontimeupdate = () => { if (audio.duration) progress.value = (audio.currentTime / audio.duration) * 100; };
        progress.oninput = () => { if (audio.duration) audio.currentTime = (progress.value / 100) * audio.duration; };
        audio.onended = nextTrack;

        renderPlaylist();
    </script>
</body>
</html>
